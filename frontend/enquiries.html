<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Enquiries</title>

    <link rel="stylesheet" href="css/enquiries.css">

</head>

<body>

    <div class="enquiries-page">

        <h1>Customer Enquiries</h1>

        <p class="page-description">
            All customer enquiries received through the website.
        </p>

        <div class="table-container">

            <table class="enquiries-table">

                <thead>
                    <tr>
                        <th>No.</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Company</th>
                        <th>Service</th>
                        <th>Message</th>
                    </tr>
                </thead>

                <tbody id="enquiries-body">

                    <tr>
                        <td colspan="7">Loading enquiries...</td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

    <script src="js/enquiries.js"></script>

</body>

</html>
